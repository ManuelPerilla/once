name: Integracion Continua ONCE

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_database_only
          POSTGRES_DB: vertice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vertice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m scripts.check_links
      - name: Probar API contra PostgreSQL desechable
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci_database_only@localhost:5432/vertice_test
        run: python -m pytest -q
      - name: Probar adopción de una base legacy con Alembic
        env:
          DATABASE_URL: postgresql://postgres:ci_database_only@localhost:5432/vertice_test
        run: python -m scripts.migration_smoke

  pruebas-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  prueba-docker:
    needs: [pruebas-api, pruebas-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_PASSWORD: ci-disposable-smoke-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar configuración temporal
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import secrets
          from src.security import hash_password
          values = {
              'SECRET_KEY': secrets.token_hex(32),
              'ADMIN_USERNAME': 'smoke',
              'ADMIN_PASSWORD_HASH': hash_password(os.environ['SMOKE_PASSWORD']),
              'POSTGRES_PASSWORD': secrets.token_hex(24),
              'COOKIE_SECURE': 'false',
              'FRONTEND_PORT': '18080',
          }
          Path('.env').write_text(''.join(f'{key}={value}\n' for key, value in values.items()))
          PY
      - run: docker compose up --build -d --wait --wait-timeout 120
      - name: Probar login, cookie y API a través de NGINX
        run: python -m scripts.smoke_test
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar pruebas de navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Probar el panel contra Docker real
        working-directory: frontend
        env:
          SMOKE_BASE_URL: http://localhost:18080
          SMOKE_DISPOSABLE: '1'
        run: npm run test:e2e
      - name: Guardar diagnóstico del navegador si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-browser-diagnostics
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Mostrar logs si falla
        if: failure()
        run: docker compose logs --no-color api frontend
      - name: Limpiar solo el entorno desechable de CI
        if: always()
        run: docker compose down -v
