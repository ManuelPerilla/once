services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGRES_DB: vertice_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vertice_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  pgadmin:
    image: dpage/pgadmin4
    profiles: ["admin"]
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@vertice.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    environment:
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      SECRET_KEY: ${SECRET_KEY:?Ejecuta python -m src.configure}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Ejecuta python -m src.configure}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Ejecuta python -m src.configure}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ROOT_PATH: /api
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
      WIKIDATA_USER_AGENT: ${WIKIDATA_USER_AGENT:-Vertice/0.1 (https://github.com/MizunDev/vertice)}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api

volumes:
  postgres_data:
